<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maury County Resource Directory</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f0e8;--card:#fffdf8;--ink:#1a1208;--ink-soft:#5a4f3a;
    --accent:#c95f2a;--accent-light:#f5ddd0;
    --green:#3a7d5a;--green-light:#d4ede0;
    --blue:#2a5f8f;--blue-light:#d0e3f5;
    --purple:#6b3fa0;--purple-light:#e8d8f8;
    --yellow:#c9941a;--yellow-light:#faecd0;
    --red:#b83232;--red-light:#f5d8d8;
    --border:#e2d8c8;--radius:12px;
    --shadow:0 2px 12px rgba(26,18,8,.08);
    --shadow-hover:0 6px 24px rgba(26,18,8,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}

  /* ── HEADER ── */
  header{background:var(--ink);color:var(--bg);padding:20px 16px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.25)}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  header h1{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--bg);line-height:1.1}
  .header-sub{font-size:.7rem;font-weight:300;color:#a89880;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
  .admin-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#a89880;font-family:'DM Sans',sans-serif;font-size:.72rem;font-weight:500;padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all .15s;flex-shrink:0}
  .admin-btn:hover{background:rgba(255,255,255,.18);color:#fff}
  .search-wrap{position:relative}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#a89880;pointer-events:none}
  #search{width:100%;padding:11px 12px 11px 38px;border-radius:8px;border:none;background:rgba(255,255,255,.1);color:#fff;font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none;transition:background .2s}
  #search::placeholder{color:#a89880}
  #search:focus{background:rgba(255,255,255,.16)}

  /* ── ADMIN BAR ── */
  .admin-bar{display:none;background:#fff7e0;border-bottom:2px solid var(--yellow);padding:10px 16px;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:108px;z-index:89}
  .admin-bar.visible{display:flex}
  .admin-label{font-size:.75rem;font-weight:600;color:var(--yellow);letter-spacing:.04em;text-transform:uppercase;flex-shrink:0}

  /* ── FILTERS ── */
  .filters{padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:108px;z-index:88}
  .admin-bar.visible ~ .filters{top:158px}
  .filters::-webkit-scrollbar{display:none}
  .pill{flex-shrink:0;padding:6px 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;color:var(--ink-soft)}
  .pill.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .pill:hover:not(.active){border-color:var(--ink-soft);color:var(--ink)}

  .results-bar{padding:10px 16px 4px;font-size:.78rem;color:var(--ink-soft);font-weight:500}

  /* ── CARDS ── */
  .cards{padding:4px 12px 80px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;box-shadow:var(--shadow);animation:fadeUp .25s ease both}
  .card.stale{border-left:3px solid var(--yellow)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
  .card-name{font-family:'DM Serif Display',serif;font-size:1.05rem;line-height:1.25;color:var(--ink);flex:1}
  .card-badges{display:flex;align-items:center;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
  .cat-badge{padding:3px 9px;border-radius:999px;font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .cat-food{background:var(--yellow-light);color:var(--yellow)}
  .cat-housing{background:var(--blue-light);color:var(--blue)}
  .cat-mental{background:var(--purple-light);color:var(--purple)}
  .cat-finance{background:var(--green-light);color:var(--green)}
  .cat-child{background:var(--accent-light);color:var(--accent)}
  .cat-career{background:#e8f0e8;color:#2d6e2d}
  .cat-transit{background:#f0e8e8;color:#8f2a2a}
  .cat-community{background:#e8e8f5;color:#3a3a8f}
  .cat-clothing{background:#f5e8f0;color:#8f2a6b}
  .cat-medical{background:#e8f5f5;color:#2a7a7a}
  .cat-veterans{background:#f5f0e0;color:#7a5a1a}
  .card-service{font-size:.85rem;color:var(--ink-soft);line-height:1.45;margin-bottom:10px}
  .card-meta{display:flex;flex-direction:column;gap:4px}
  .meta-row{display:flex;align-items:flex-start;gap:6px;font-size:.78rem;color:var(--ink-soft)}
  .meta-row svg{flex-shrink:0;margin-top:1px;color:var(--accent)}
  .meta-label{font-weight:600;color:var(--ink);margin-right:2px}
  .req-none{display:inline-block;background:var(--green-light);color:var(--green);font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:2px}
  .card a{color:var(--accent);text-decoration:none;font-weight:500}
  .card-edit-btn{background:none;border:1px solid var(--border);color:var(--ink-soft);font-size:.65rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;flex-shrink:0}
  .card-edit-btn:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}

  /* ── EMPTY ── */
  .empty{text-align:center;padding:60px 24px;color:var(--ink-soft)}
  .empty-icon{font-size:2.5rem;margin-bottom:12px}
  .empty h3{font-family:'DM Serif Display',serif;font-size:1.3rem;margin-bottom:6px}
  .empty p{font-size:.88rem}

  /* ── FOOTER ── */
  .footer-note{text-align:center;font-size:.72rem;color:var(--ink-soft);padding:0 16px 28px;opacity:.7}

  /* ── MODAL ── */
  .overlay{display:none;position:fixed;inset:0;background:rgba(26,18,8,.55);z-index:200;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .modal{background:var(--card);width:100%;max-width:580px;border-radius:16px 16px 0 0;padding:24px 20px 36px;max-height:92vh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.18);animation:slideUp .25s ease}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .modal-title{font-family:'DM Serif Display',serif;font-size:1.2rem;color:var(--ink)}
  .modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px}

  /* ── FORM ── */
  .field{margin-bottom:13px}
  .field label{display:block;font-size:.75rem;font-weight:600;color:var(--ink-soft);margin-bottom:4px;letter-spacing:.02em;text-transform:uppercase}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--ink);background:var(--bg);outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .field textarea{resize:vertical;min-height:66px;line-height:1.5}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* ── BUTTONS ── */
  .btn-row{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
  .btn{flex:1;min-width:100px;padding:11px 14px;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.86rem;font-weight:600;cursor:pointer;transition:all .15s;border:none;text-align:center}
  .btn-primary{background:var(--ink);color:var(--bg)}
  .btn-primary:hover{background:#2e2010}
  .btn-secondary{background:var(--border);color:var(--ink-soft)}
  .btn-secondary:hover{background:#d0c8b8}
  .btn-danger{background:var(--red-light);color:var(--red)}
  .btn-danger:hover{background:#e8c0c0}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-accent:hover{background:#b05020}
  .btn-sm{flex:none;padding:7px 14px;font-size:.78rem;min-width:0}

  /* ── MESSAGES ── */
  .msg{font-size:.82rem;padding:8px 12px;border-radius:7px;margin-bottom:12px}
  .msg.err{background:var(--red-light);color:var(--red)}
  .msg.ok{background:var(--green-light);color:var(--green)}
  .login-hint{font-size:.82rem;color:var(--ink-soft);margin-bottom:16px}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-top">
    <div>
      <h1>Maury County Resources</h1>
      <div class="header-sub">Columbia, TN · 2026</div>
    </div>
    <button class="admin-btn" id="adminToggleBtn" onclick="openLogin()">Admin</button>
  </div>
  <div class="search-wrap">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input id="search" type="search" placeholder="Search by need, org, or keyword…" autocomplete="off">
  </div>
</header>

<!-- ADMIN BAR -->
<div class="admin-bar" id="adminBar">
  <span class="admin-label">⚙ Admin Mode</span>
  <button class="btn btn-accent btn-sm" onclick="openForm(null)">+ Add Resource</button>
  <button class="btn btn-secondary btn-sm" onclick="exportJSON()">Export JSON</button>
  <button class="btn btn-secondary btn-sm" onclick="exportCSV()">Export CSV</button>
  <button class="btn btn-danger btn-sm" onclick="adminLogout()">Log out</button>
</div>

<!-- FILTERS -->
<div class="filters" id="filters">
  <button class="pill active" data-cat="all">All</button>
  <button class="pill" data-cat="food">🍎 Food</button>
  <button class="pill" data-cat="housing">🏠 Housing</button>
  <button class="pill" data-cat="mental">🧠 Mental Health</button>
  <button class="pill" data-cat="finance">💰 Financial Aid</button>
  <button class="pill" data-cat="child">👶 Children</button>
  <button class="pill" data-cat="clothing">👕 Clothing</button>
  <button class="pill" data-cat="career">💼 Career</button>
  <button class="pill" data-cat="transit">🚌 Transport</button>
  <button class="pill" data-cat="medical">🏥 Medical</button>
  <button class="pill" data-cat="veterans">🎖 Veterans</button>
  <button class="pill" data-cat="community">🤝 Community</button>
</div>

<div class="results-bar" id="results-bar"></div>
<div class="cards" id="cards"></div>
<p class="footer-note" id="footer-note"></p>

<!-- LOGIN MODAL -->
<div class="overlay" id="loginOverlay" onclick="bgClose(event,'loginOverlay')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Admin Login</span>
      <button class="modal-close" onclick="closeModal('loginOverlay')">×</button>
    </div>
    <p class="login-hint">Enter the admin password to manage listings.</p>
    <div id="loginMsg"></div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="doLogin()">Log In</button>
      <button class="btn btn-secondary" onclick="closeModal('loginOverlay')">Cancel</button>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="overlay" id="formOverlay" onclick="bgClose(event,'formOverlay')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="formTitle">Add Resource</span>
      <button class="modal-close" onclick="closeModal('formOverlay')">×</button>
    </div>
    <div id="formMsg"></div>
    <div class="field"><label>Organization Name *</label><input type="text" id="fName" placeholder="e.g. FISH Food Bank"></div>
    <div class="field"><label>Category *</label>
      <select id="fCat">
        <option value="food">🍎 Food</option>
        <option value="housing">🏠 Housing</option>
        <option value="mental">🧠 Mental Health</option>
        <option value="finance">💰 Financial Aid</option>
        <option value="child">👶 Children</option>
        <option value="clothing">👕 Clothing</option>
        <option value="career">💼 Career</option>
        <option value="transit">🚌 Transportation</option>
        <option value="medical">🏥 Medical / Dental / Vision</option>
        <option value="veterans">🎖 Veterans</option>
        <option value="community">🤝 Community</option>
      </select>
    </div>
    <div class="field"><label>Services Offered *</label><textarea id="fService" placeholder="What does this org provide?"></textarea></div>
    <div class="field-row">
      <div class="field"><label>Hours</label><input type="text" id="fHours" placeholder="Mon–Fri 9am–5pm"></div>
      <div class="field"><label>Phone</label><input type="text" id="fPhone" placeholder="931-000-0000"></div>
    </div>
    <div class="field"><label>Address</label><input type="text" id="fAddress" placeholder="Street address, Columbia"></div>
    <div class="field"><label>Website</label><input type="url" id="fWeb" placeholder="https://…"></div>
    <div class="field"><label>Requirements / Eligibility</label><textarea id="fReq" placeholder="Type 'none' if no requirements…" style="min-height:52px"></textarea></div>
    <div class="field"><label>Last Verified</label><input type="date" id="fVerified"></div>
    <div class="btn-row" id="formBtns"></div>
  </div>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="overlay" id="deleteOverlay" onclick="bgClose(event,'deleteOverlay')">
  <div class="modal" style="max-height:48vh">
    <div class="modal-header">
      <span class="modal-title">Remove Resource</span>
      <button class="modal-close" onclick="closeModal('deleteOverlay')">×</button>
    </div>
    <p style="font-size:.9rem;color:var(--ink-soft);margin-bottom:20px">Remove <strong id="deleteName"></strong>? This cannot be undone.</p>
    <div class="btn-row">
      <button class="btn btn-danger" onclick="confirmDelete()">Yes, Remove</button>
      <button class="btn btn-secondary" onclick="closeModal('deleteOverlay')">Cancel</button>
    </div>
  </div>
</div>

// ── HELPERS ──
function catClass(c){return{food:'cat-food',housing:'cat-housing',mental:'cat-mental',finance:'cat-finance',child:'cat-child',clothing:'cat-clothing',career:'cat-career',transit:'cat-transit',medical:'cat-medical',veterans:'cat-veterans',community:'cat-community'}[c]||'cat-community'}
function catLabel(c){return{food:'Food',housing:'Housing',mental:'Mental Health',finance:'Financial Aid',child:'Children',clothing:'Clothing',career:'Career',transit:'Transport',medical:'Medical',veterans:'Veterans',community:'Community'}[c]||c}
const IC={clock:`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>`,pin:`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,phone:`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.9a16 16 0 0 0 6.09 6.09l.95-.95a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 21.73 16.92z"/></svg>`,req:`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`,cal:`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,globe:`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`};

// ── RENDER ──
function render(){
  const q=query.toLowerCase();
  const f=data.filter(d=>(activecat==='all'||d.cat===activecat)&&(!q||[d.name,d.service,d.address,d.req,d.phone].join(' ').toLowerCase().includes(q)));
  document.getElementById('results-bar').textContent=f.length?`${f.length} resource${f.length!==1?'s':''} found`:'';
  const el=document.getElementById('cards');
  if(!f.length){el.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><h3>No results found</h3><p>Try a different search or category.</p></div>`;return}
  const ONE_YR=365*24*60*60*1000,now=Date.now();
  el.innerHTML=f.map((d,i)=>{
    const stale=d.verified&&(now-new Date(d.verified).getTime())>ONE_YR;
    const ver=d.verified?new Date(d.verified).toLocaleDateString('en-US',{month:'short',year:'numeric'}):'';
    const ph=d.phone?d.phone.replace(/[^0-9+]/g,''):'';
    return `<div class="card${stale?' stale':''}" style="animation-delay:${Math.min(i*.04,.4)}s">
      <div class="card-top">
        <div class="card-name">${d.name}</div>
        <div class="card-badges">
          <span class="cat-badge ${catClass(d.cat)}">${catLabel(d.cat)}</span>
          ${isAdmin?`<button class="card-edit-btn" onclick="openForm(${d.id})">Edit</button>`:''}
        </div>
      </div>
      <div class="card-service">${d.service}</div>
      <div class="card-meta">
        ${d.hours?`<div class="meta-row">${IC.clock}<span><span class="meta-label">Hours:</span>${d.hours}</span></div>`:''}
        ${d.address?`<div class="meta-row">${IC.pin}<span>${d.address}</span></div>`:''}
        ${d.phone?`<div class="meta-row">${IC.phone}<span><a href="tel:${ph}">${d.phone}</a></span></div>`:''}
        ${d.web?`<div class="meta-row">${IC.globe}<span><a href="${d.web.startsWith('http')?d.web:'https://'+d.web}" target="_blank" rel="noopener">${d.web.replace(/^https?:\/\//,'')}</a></span></div>`:''}
        <div class="meta-row">${IC.req}<span><span class="meta-label">Requirements:</span>${d.req==='none'?'<span class="req-none">None</span>':d.req}</span></div>
        ${ver?`<div class="meta-row">${IC.cal}<span style="color:${stale?'var(--yellow)':'var(--ink-soft)'}"><span class="meta-label">Verified:</span>${ver}${stale?' · needs update':''}</span></div>`:''}
      </div>
    </div>`}).join('');
}

// ── FILTER PILLS ──
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});
document.getElementById('filters').addEventListener('click',e=>{
  const p=e.target.closest('.pill');if(!p)return;
  document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
  p.classList.add('active');activecat=p.dataset.cat;render();
});

// ── LOGIN ──
function openLogin(){if(isAdmin){adminLogout();return}document.getElementById('loginMsg').innerHTML='';document.getElementById('loginPw').value='';openModal('loginOverlay');setTimeout(()=>document.getElementById('loginPw').focus(),200)}
function doLogin(){
  if(document.getElementById('loginPw').value===ADMIN_PW){
    isAdmin=true;closeModal('loginOverlay');
    document.getElementById('adminBar').classList.add('visible');
    document.getElementById('adminToggleBtn').textContent='Exit Admin';render();
  }else{document.getElementById('loginMsg').innerHTML='<div class="msg err">Incorrect password.</div>';document.getElementById('loginPw').select()}
}
function adminLogout(){isAdmin=false;document.getElementById('adminBar').classList.remove('visible');document.getElementById('adminToggleBtn').textContent='Admin';render()}

// ── ADD / EDIT ──
function openForm(id){
  editingId=id;
  const d=id?data.find(x=>x.id===id):null;
  document.getElementById('formTitle').textContent=d?'Edit Resource':'Add Resource';
  document.getElementById('formMsg').innerHTML='';
  document.getElementById('fName').value=d?.name||'';
  document.getElementById('fCat').value=d?.cat||'food';
  document.getElementById('fService').value=d?.service||'';
  document.getElementById('fHours').value=d?.hours||'';
  document.getElementById('fAddress').value=d?.address||'';
  document.getElementById('fPhone').value=d?.phone||'';
  document.getElementById('fWeb').value=d?.web||'';
  document.getElementById('fReq').value=d?.req||'';
  document.getElementById('fVerified').value=d?.verified||new Date().toISOString().slice(0,10);
  document.getElementById('formBtns').innerHTML=d
    ?`<button class="btn btn-primary" onclick="saveForm()">Save Changes</button><button class="btn btn-danger" onclick="openDelete(${id})">Remove</button><button class="btn btn-secondary" onclick="closeModal('formOverlay')">Cancel</button>`
    :`<button class="btn btn-accent" onclick="saveForm()">Add Resource</button><button class="btn btn-secondary" onclick="closeModal('formOverlay')">Cancel</button>`;
  openModal('formOverlay');setTimeout(()=>document.getElementById('fName').focus(),200);
}
function saveForm(){
  const name=document.getElementById('fName').value.trim();
  const service=document.getElementById('fService').value.trim();
  if(!name||!service){document.getElementById('formMsg').innerHTML='<div class="msg err">Name and Services are required.</div>';return}
  const entry={id:editingId||nextId(),name,cat:document.getElementById('fCat').value,service,hours:document.getElementById('fHours').value.trim(),address:document.getElementById('fAddress').value.trim(),phone:document.getElementById('fPhone').value.trim(),web:document.getElementById('fWeb').value.trim(),req:document.getElementById('fReq').value.trim()||'none',verified:document.getElementById('fVerified').value||new Date().toISOString().slice(0,10)};
  if(editingId){const i=data.findIndex(x=>x.id===editingId);data[i]=entry}else{data.push(entry)}
  saveData();closeModal('formOverlay');render();
}

// ── DELETE ──
function openDelete(id){pendingDeleteId=id;document.getElementById('deleteName').textContent=data.find(x=>x.id===id)?.name||'this resource';closeModal('formOverlay');openModal('deleteOverlay')}
function confirmDelete(){data=data.filter(x=>x.id!==pendingDeleteId);saveData();pendingDeleteId=null;closeModal('deleteOverlay');render()}

// ── EXPORT ──
function exportJSON(){dl(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'maury-county-resources.json')}
function exportCSV(){const cols=['id','name','cat','service','hours','address','phone','web','req','verified'];const rows=data.map(d=>cols.map(c=>`"${(d[c]||'').replace(/"/g,'""')}"`).join(','));dl(new Blob([cols.join(',')+'\n'+rows.join('\n')],{type:'text/csv'}),'maury-county-resources.csv')}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}

// ── MODAL ──
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function bgClose(e,id){if(e.target===document.getElementById(id))closeModal(id)}

// ── FOOTER: auto-stamp year and last-updated date ──
(function(){
  const yr = new Date().getFullYear();
  const updated = new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  const el = document.getElementById('footer-note');
  if(el) el.textContent = `Source: TCFD Maury County Resource Guide · Last updated ${updated} · © ${yr} Maury County Resource Directory`;
})();

// ── INIT ──
loadData();render();
</script>
</body>
</html>
